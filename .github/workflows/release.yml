name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'リリースバージョンタグ (例: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Go 環境セットアップ
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Node.js 環境セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Wails CLI インストール
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: フロントエンド依存パッケージのインストール
        run: |
          cd frontend
          npm ci

      - name: Wails アプリケーションビルド (Windows amd64)
        run: wails build -platform windows/amd64 -clean -s

      - name: リリース用実行ファイル準備
        shell: pwsh
        run: |
          $binDir = "build\bin"
          Copy-Item "$binDir\aicompanion.exe" -Destination "$binDir\version1.0.0.exe"
          Copy-Item "$binDir\aicompanion.exe" -Destination "$binDir\aicompanion-v1.0.0-windows-amd64.exe"
          Get-ChildItem $binDir

      - name: GitHub Release の作成とバイナリアップロード
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}
          name: "Desktop AI Companion Release ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}"
          body: |
            ## Desktop AI Companion Studio v1.0.0 正式リリース

            完全ローカル動作・プライバシー保護型デスクトップAIコンパニオン アプリケーションです。

            ### 主な機能
            - **Godot風 4ペイン Studioエディタ**: キャラクター作成・編集、Live2D/VRMモデル設定、リアルタイム対話テスト
            - **デスクトップ常駐全画面透過オーバーレイ**: 枠なし・完全透明・最前面固定でアバターが画面上に直接常駐
            - **自律的階層Web情報解決**: Level 0（高速日常対話）からLevel 3（自律検索）まで、最新ニュースや事実情報を自律取得
            - **高機能コンソール**: カテゴリ別フィルター、キーワード検索、自動追従、個別＆全行コピペ対応
            - **低遅延音声合成 & リップシンク**: 発話完了後2秒での吹き出し自動消去対応

            ### 配布バイナリ
            - `version1.0.0.exe`: Windows 64bit 単一実行ファイル
            - `aicompanion-v1.0.0-windows-amd64.exe`: Windows 64bit 実行ファイル (標準命名)
          files: |
            build/bin/version1.0.0.exe
            build/bin/aicompanion-v1.0.0-windows-amd64.exe
            build/bin/aicompanion.exe
          draft: false
          prerelease: false
